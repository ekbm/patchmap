# Refreshes Microsoft's data every Wednesday (the day after Patch Tuesday in the US)
# and publishes the website to GitHub Pages. Also runs on every push to main.
name: Refresh data and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 3"   # Wednesdays 03:00 UTC
  workflow_dispatch:       # "Run workflow" button on GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: Refresh Microsoft data
        if: github.event_name != 'push'
        run: |
          python scripts/fetch_msrc.py
          python scripts/fetch_release_health.py
          python scripts/fetch_kb_titles.py
          python scripts/fetch_files.py
          python scripts/build_feed.py

      - name: Save refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "patchmap-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data feed.xml feeds
          git diff --cached --quiet || (git commit -m "Refresh Microsoft data" && git push)

      - name: Build site folder
        run: |
          python3 scripts/build_pages.py
          mkdir _site
          cp -r kb problem error version sitemap.xml robots.txt _site/
          cp index.html about.html app.js style.css LICENSE LICENSE-DATA.md _site/
          cp -r data _site/data
          cp feed.xml _site/ && cp -r feeds _site/feeds
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
